[workspace]
resolver = "3"
members = [
    "crates/zrush-core",
    "crates/zrush",
    "crates/zrush-gui",
    "crates/zrush-session-end",
]

# Shared by every crate in the workspace, so a version is decided once.
[workspace.package]
version = "0.0.4"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
repository = "https://github.com/christphe/zrush"

# Every crate states its dependencies through these, so a version is decided
# once. Run `cargo build --locked` after touching any of it, or CI will be
# the one to notice.
[workspace.dependencies]
zrush-core = { path = "crates/zrush-core", version = "0.0.4" }

clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
jiff = "0.2.15"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.12"
toml = "1.2.0"
# The update check: one GET a day. rustls, so there is no OpenSSL to find
# on Linux and nothing to install on Windows.
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
unicode-width = "0.2.2"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }

# The desktop app. egui's crates move together: egui_dock and
# egui_commonmark follow eframe a release behind, so all of them are pinned
# to the line egui_dock supports.
eframe = { version = "0.36.2", features = ["persistence"] }
egui = "0.36.2"
egui_dock = "0.21.1"
egui_commonmark = "0.25.0"
rfd = "0.18.0"
# The macOS menu bar: eframe draws none of its own.
muda = { version = "0.21.2", default-features = false }
# The icon inside zrush.exe, which a pinned taskbar button shows.
winresource = "0.1"
# Windows asking the window to go: an installer replacing zrush.exe, a
# sign-out. winit does not pass it on; zrush-session-end listens.
zrush-session-end = { path = "crates/zrush-session-end" }
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Recovery",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
egui_kittest = { version = "0.36.2", features = ["eframe"] }

assert_cmd = "2.2.2"
insta = "1.48.0"
portable-pty = "0.9.0"
predicates = "3.1.4"
tempfile = "3.27.0"

# Applied by every crate through `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Terminal coordinates and collection indices convert back and forth all
# over the table code; casting each one by hand is noise, not safety.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# These doc comments describe behaviour, not panics we promise to keep.
missing_panics_doc = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
# The maps here are built and consumed inside the workspace; a hasher
# parameter would buy nothing and cost every signature.
implicit_hasher = "allow"
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
strip = true
lto = "thin"
