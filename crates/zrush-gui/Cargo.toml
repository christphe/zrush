[package]
name = "zrush-gui"
description = "zrush in a window: several repos in tabs, their worktrees, sessions and conversations"
# Its own version: the desktop app ships on its own schedule (gui-vX.Y.Z).
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "zrush-gui"
path = "src/main.rs"

[dependencies]
zrush-core.workspace = true

eframe.workspace = true
egui.workspace = true
egui_dock.workspace = true
egui_commonmark.workspace = true
rfd.workspace = true
serde.workspace = true
toml.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
