# The toolchain this repository builds with, here and in CI alike: rustup
# reads this file for every cargo run inside the checkout.
#
# Pinned, because each new stable brings new clippy lints and -D warnings
# turns them into a red main overnight (1.99's assert_is_empty did). Raise
# it on purpose, in a commit of its own, once `./check` passes with it.
#
# The MSRV (rust-version in Cargo.toml) is a separate promise; CI checks it
# by overriding this file with RUSTUP_TOOLCHAIN.
[toolchain]
channel = "1.99.1"
components = ["clippy", "rustfmt"]
profile = "minimal"
