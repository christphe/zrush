name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run pointless: drop it.
# Keyed by ref, so main and a pull request never cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # transform-footer needs fzf >= 0.65, which the distro packages do not carry.
  FZF_VERSION: "0.74.4"
  # Pinned: the runners ship 0.9.0 (Linux) or nothing at all (macOS), and 0.9.0
  # reports SC2015 on guards of the form `[ a ] && [ b ] || fallback`, where the
  # fallback running on a true-then-false is precisely the point.
  SHELLCHECK_VERSION: "0.11.0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install fzf ${{ env.FZF_VERSION }}
        run: |
          set -euo pipefail
          case "${{ runner.os }}-$(uname -m)" in
            Linux-x86_64)  asset=linux_amd64  ;;
            Linux-aarch64) asset=linux_arm64  ;;
            macOS-arm64)   asset=darwin_arm64 ;;
            macOS-x86_64)  asset=darwin_amd64 ;;
            *) echo "unsupported runner: $(uname -sm)" >&2; exit 1 ;;
          esac
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/junegunn/fzf/releases/download/v${FZF_VERSION}/fzf-${FZF_VERSION}-${asset}.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" fzf
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install shellcheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          set -euo pipefail
          case "${{ runner.os }}-$(uname -m)" in
            Linux-x86_64)  asset=linux.x86_64    ;;
            Linux-aarch64) asset=linux.aarch64   ;;
            macOS-arm64)   asset=darwin.aarch64  ;;
            macOS-x86_64)  asset=darwin.x86_64   ;;
            *) echo "unsupported runner: $(uname -sm)" >&2; exit 1 ;;
          esac
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.${asset}.tar.xz" \
            | tar -xJ -C "$HOME/.local/bin" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: |
          bash --version | head -1
          fzf --version
          shellcheck --version | sed -n '2p'
          jq --version
          python3 --version
          git --version

      # tests/run is the whole gate: bash -n, shellcheck, then every test file.
      # The picker tests drive fzf on a pty, so they are timing-sensitive; a CI
      # runner is slower than a laptop, hence the longer warmup.
      - name: Checks and tests
        env:
          WARMUP: "7"
        run: ./tests/run

  package:
    name: zip
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the zip
        id: zip
        run: |
          set -euo pipefail
          name="zrush-$(git rev-parse --short HEAD)"
          mkdir -p "dist/$name"
          cp -R bin zed install.sh README.md LICENSE "dist/$name/"
          (cd dist && zip -qr "$name.zip" "$name")
          unzip -l "dist/$name.zip"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: dist/${{ steps.zip.outputs.name }}.zip
          if-no-files-found: error
          retention-days: 30
