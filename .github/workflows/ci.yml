name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run pointless: drop it.
# Keyed by ref, so main and a pull request never cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # The tests build throwaway repositories, so git must be able to
      # commit. The runners set no identity by default.
      - name: Give git an identity
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name "zrush ci"
          git config --global init.defaultBranch main

      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # --no-fail-fast: one platform-specific break should not hide the
      # others behind it.
      - run: cargo nextest run --workspace --locked --no-fail-fast

  lint:
    name: fmt and deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - uses: EmbarkStudios/cargo-deny-action@v2

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

  release:
    name: ${{ matrix.target }}
    needs: [test, lint]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: macos-latest,   target: x86_64-apple-darwin }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # The only target that needs a cross linker; the rest build natively.
      - name: Cross linker for aarch64 linux
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - run: cargo build --release --locked --target ${{ matrix.target }} -p zrush

      # What ships is what install.sh expects to find next to it: the
      # binary, the installer, and the Zed files it copies.
      - name: Pack
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          name="zrush-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/zrush.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/zrush" "dist/$name/"
            cp install.sh "dist/$name/"
            cp -R zed "dist/$name/"
          fi
          cp README.md LICENSE "dist/$name/"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.pack.outputs.name }}
          path: dist/${{ steps.pack.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      # A tag, and only a tag, publishes. One archive per target, each with
      # its own checksum: five jobs writing one SHA256SUMS would race.
      - name: Archive
        if: startsWith(github.ref, 'refs/tags/v')
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          name="${{ steps.pack.outputs.name }}"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            file="$name.zip"
            7z a -tzip "$file" "$name" > /dev/null
          else
            file="$name.tar.gz"
            tar -czf "$file" "$name"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$file" > "$file.sha256"
          else
            shasum -a 256 "$file" > "$file.sha256"
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # Five jobs reach this at once; the first one wins the create and
          # the others find it already there.
          gh release view "$tag" > /dev/null 2>&1 \
            || gh release create "$tag" --title "$tag" --generate-notes \
            || gh release view "$tag" > /dev/null
          f="${{ steps.archive.outputs.file }}"
          gh release upload "$tag" "dist/$f" "dist/$f.sha256" --clobber
