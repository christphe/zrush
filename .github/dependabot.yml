version: 2
updates:
  # The Cargo workspace: one manifest at the root decides every version.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  # The actions used by CI.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    ignore:
      # Its tag is the Rust version to install (the MSRV job's), not a
      # release of the action: bumping it breaks the MSRV promise.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        patterns: ["*"]
